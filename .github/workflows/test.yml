name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The unit tests and the repo conventions, then the template build,
      # which fails at or over the S3 deploy's 1 MB limit.
      - run: make test
      - run: make build

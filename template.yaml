AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ci-runner: single-use EC2 and Fargate self-hosted GitHub Actions runners
  for zeroae's private repos. Source template; `make build` inlines
  functions/*.js.

# Layout rules (see docs/stack.md):
# - every role and policy is PowerUserPB-${AWS::StackName}-<suffix> with the
#   PowerUserAccess permissions boundary;
# - each function's code is `//@inline functions/<name>.js` under `ZipFile: |`.

Parameters:
  GitHubOrg:
    Type: String
    Default: zeroae
  AppName:
    Type: String
    Default: zeroae-ci-runner
    Description: Name of the GitHub App the setup URL registers (globally unique on GitHub).
  LogRetentionDays:
    Type: Number
    Default: 30
  RunnerGroup:
    Type: String
    Default: ci-runner
    Description: The org runner group every CI runner registers into (created after the stack).
  SpotVcpuCap:
    Type: Number
    Default: 24
    Description: Most vCPUs the Spot CI runners hold at once, both architectures (soft). Draws on the EC2 Spot vCPU quota.
  OnDemandVcpuCap:
    Type: Number
    Default: 8
    Description: Most vCPUs the On-Demand CI runners hold at once, both architectures (soft). Draws on the EC2 On-Demand vCPU quota.
  FargateSpotVcpuCap:
    Type: Number
    Default: 24
    Description: Most vCPUs the Fargate Spot CI runners hold at once, both architectures (soft). Draws on the Fargate Spot vCPU quota.
  FargateVcpuCap:
    Type: Number
    Default: 8
    Description: Most vCPUs the Fargate On-Demand CI runners hold at once, both architectures (soft). Draws on the Fargate On-Demand vCPU quota.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: Leave empty to create GitHub's OIDC provider. An account holds one provider per URL, so if `aws iam list-open-id-connect-providers` already shows token.actions.githubusercontent.com, give its ARN here.

Conditions:
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  # App id, private key and webhook secret. Created holding only `state_key`
  # (the setup function's HMAC key for `state`); setup replaces the whole value
  # once, from the manifest conversion. Do not edit GenerateSecretString: a
  # change makes CloudFormation regenerate the value and wipe the App's key.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/github-app"
      Description: GitHub App credentials for ci-runner (written once by the setup function).
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: state_key
        PasswordLength: 64
        ExcludePunctuation: true

  # --- setup: one-time App registration (manifest flow) ---------------------
  SetupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-setup"
      RetentionInDays: !Ref LogRetentionDays

  SetupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "PowerUserPB-${AWS::StackName}-setup"
      PermissionsBoundary: arn:aws:iam::aws:policy/PowerUserAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "PowerUserPB-${AWS::StackName}-setup"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${SetupLogGroup.Arn}"
              # The only function allowed to write the secret.
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:PutSecretValue]
                Resource: !Ref AppSecret

  SetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-setup"
      Description: One-time GitHub App registration through the manifest flow.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SetupRole.Arn
      Timeout: 15
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref SetupLogGroup
      Environment:
        Variables:
          SECRET_ARN: !Ref AppSecret
          WEBHOOK_URL: !GetAtt WebhookUrl.FunctionUrl
          GITHUB_ORG: !Ref GitHubOrg
          APP_NAME: !Ref AppName
      Code:
        ZipFile: |
          //@inline functions/setup.js

  SetupUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref SetupFunction
      AuthType: NONE

  SetupUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SetupFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  SetupUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SetupFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # --- the job queue: webhook -> launcher -----------------------------------
  # A message that fails 5 receives (2 minutes apart) goes to the DLQ. A job
  # left queued that long is GitHub's to time out.
  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-jobs"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 5

  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-jobs-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # --- webhook: verify, label contract, fence 3, enqueue, swap repair ---------
  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-webhook"
      RetentionInDays: !Ref LogRetentionDays

  WebhookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "PowerUserPB-${AWS::StackName}-webhook"
      PermissionsBoundary: arn:aws:iam::aws:policy/PowerUserAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "PowerUserPB-${AWS::StackName}-webhook"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${WebhookLogGroup.Arn}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt JobQueue.Arn
              # Swap repair: find a runner's instance, and re-tag it with the
              # job it really runs. Only the job tags, only the stack's instances.
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ci-runner:stack: !Ref AWS::StackName
                  ForAllValues:StringEquals:
                    aws:TagKeys: [ci-runner:repo, ci-runner:job-id, ci-runner:run-id, ci-runner:head-sha, ci-runner:job-name]

  WebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-webhook"
      Description: GitHub workflow_job webhook receiver.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt WebhookRole.Arn
      Timeout: 10
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref WebhookLogGroup
      Environment:
        Variables:
          SECRET_ARN: !Ref AppSecret
          QUEUE_URL: !Ref JobQueue
          GITHUB_ORG: !Ref GitHubOrg
          STACK_NAME: !Ref AWS::StackName
      Code:
        ZipFile: |
          //@inline functions/webhook.js

  WebhookUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref WebhookFunction
      AuthType: NONE

  WebhookUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebhookFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  WebhookUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebhookFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # --- launcher: one instance per still-queued job ---------------------------
  LauncherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-launcher"
      RetentionInDays: !Ref LogRetentionDays

  LauncherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "PowerUserPB-${AWS::StackName}-launcher"
      PermissionsBoundary: arn:aws:iam::aws:policy/PowerUserAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "PowerUserPB-${AWS::StackName}-launcher"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LauncherLogGroup.Arn}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility, sqs:SendMessage]
                Resource: !GetAtt JobQueue.Arn
              # The budgets count instances' vCPUs; no resource-level permissions.
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              # A version per launch carries the user-data.
              - Effect: Allow
                Action: [ec2:CreateLaunchTemplateVersion, ec2:DeleteLaunchTemplateVersions]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${RunnerLaunchTemplate}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${Arm64RunnerLaunchTemplate}"
              # The fleet, from these launch templates, into this stack's subnets
              # and security group only. No iam:PassRole: there is no role.
              - Effect: Allow
                Action: [ec2:CreateFleet, ec2:RunInstances]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:fleet/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${RunnerLaunchTemplate}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${Arm64RunnerLaunchTemplate}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${Subnet0}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${Subnet1}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${Subnet2}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${RunnerSecurityGroup}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*"
              # CreateFleet's check on what it creates carries no launch
              # template key; the statement above already pins the template,
              # subnets and security group. RunInstances does carry one.
              - Effect: Allow
                Action: ec2:CreateFleet
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
                Condition:
                  ArnEquals:
                    ec2:LaunchTemplate:
                      - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${RunnerLaunchTemplate}"
                      - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${Arm64RunnerLaunchTemplate}"
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:*/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: [CreateFleet, RunInstances]
              # The launch template's image is resolve:ssm: at each launch.
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*"
              # Fargate: the two task definitions, in the stack's cluster only.
              - Effect: Allow
                Action: ecs:RunTask
                Resource: [!Ref RunnerTaskDefinition, !Ref Arm64RunnerTaskDefinition]
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt RunnerCluster.Arn
              # The only role a task gets: its execution role (no task role).
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RunnerExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Effect: Allow
                Action: ecs:TagResource
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${RunnerCluster}/*"
                Condition:
                  StringEquals:
                    ecs:CreateAction: RunTask
              # The Fargate budgets count the cluster's tasks.
              - Effect: Allow
                Action: ecs:ListTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt RunnerCluster.Arn
              - Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${RunnerCluster}/*"

  LauncherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-launcher"
      Description: Launches one CI runner instance or task per still-queued job from the queue.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LauncherRole.Arn
      Timeout: 60
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref LauncherLogGroup
      Environment:
        Variables:
          SECRET_ARN: !Ref AppSecret
          GITHUB_ORG: !Ref GitHubOrg
          RUNNER_GROUP: !Ref RunnerGroup
          STACK_NAME: !Ref AWS::StackName
          LAUNCH_TEMPLATE_ID: !Ref RunnerLaunchTemplate
          ARM64_LAUNCH_TEMPLATE_ID: !Ref Arm64RunnerLaunchTemplate
          SUBNET_IDS: !Join [",", [!Ref Subnet0, !Ref Subnet1, !Ref Subnet2]]
          QUEUE_URL: !Ref JobQueue
          SPOT_VCPU_CAP: !Ref SpotVcpuCap
          ONDEMAND_VCPU_CAP: !Ref OnDemandVcpuCap
          FARGATE_SPOT_VCPU_CAP: !Ref FargateSpotVcpuCap
          FARGATE_VCPU_CAP: !Ref FargateVcpuCap
          CLUSTER: !Ref RunnerCluster
          TASK_DEFINITION: !Ref RunnerTaskDefinition
          ARM64_TASK_DEFINITION: !Ref Arm64RunnerTaskDefinition
          SECURITY_GROUP_ID: !Ref RunnerSecurityGroup
          # In SUBNET_IDS' order: arm64 tasks skip a subnet in use1-az3.
          SUBNET_AZ_IDS: !Join [",", [!GetAtt Subnet0.AvailabilityZoneId, !GetAtt Subnet1.AvailabilityZoneId, !GetAtt Subnet2.AvailabilityZoneId]]
      Code:
        ZipFile: |
          //@inline functions/launcher.js

  LauncherQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref LauncherFunction
      EventSourceArn: !GetAtt JobQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]

  # --- sweeper: terminates strays, removes orphan registrations -------------
  SweeperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-sweeper"
      RetentionInDays: !Ref LogRetentionDays

  SweeperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "PowerUserPB-${AWS::StackName}-sweeper"
      PermissionsBoundary: arn:aws:iam::aws:policy/PowerUserAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "PowerUserPB-${AWS::StackName}-sweeper"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${SweeperLogGroup.Arn}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret
              # DescribeInstances supports no resource-level permissions.
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              # Only this stack's instances: a call naming any other instance,
              # or an untagged one, is denied as a whole.
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ci-runner:stack: !Ref AWS::StackName
              # The cluster's tasks: every one of them is the stack's.
              - Effect: Allow
                Action: ecs:ListTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt RunnerCluster.Arn
              - Effect: Allow
                Action: [ecs:DescribeTasks, ecs:StopTask]
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${RunnerCluster}/*"

  SweeperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-sweeper"
      Description: Terminates CI runner instances and stops tasks over 2 hours old; removes offline runner registrations with neither.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SweeperRole.Arn
      Timeout: 60
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref SweeperLogGroup
      Environment:
        Variables:
          SECRET_ARN: !Ref AppSecret
          STACK_NAME: !Ref AWS::StackName
          GITHUB_ORG: !Ref GitHubOrg
          RUNNER_GROUP: !Ref RunnerGroup
          CLUSTER: !Ref RunnerCluster
      Code:
        ZipFile: |
          //@inline functions/sweeper.js

  SweeperSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-sweeper"
      ScheduleExpression: rate(10 minutes)
      Targets:
        - Id: sweeper
          Arn: !GetAtt SweeperFunction.Arn

  SweeperSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SweeperFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SweeperSchedule.Arn

  # --- notifier: a Spot reclaim becomes a failed check run -------------------
  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-notifier"
      RetentionInDays: !Ref LogRetentionDays

  NotifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "PowerUserPB-${AWS::StackName}-notifier"
      PermissionsBoundary: arn:aws:iam::aws:policy/PowerUserAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "PowerUserPB-${AWS::StackName}-notifier"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${NotifierLogGroup.Arn}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${RunnerCluster}/*"

  NotifierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-notifier"
      Description: Reports a Spot reclaim, of an instance or a task, as a failed check run.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt NotifierRole.Arn
      Timeout: 30
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref NotifierLogGroup
      Environment:
        Variables:
          SECRET_ARN: !Ref AppSecret
          GITHUB_ORG: !Ref GitHubOrg
          STACK_NAME: !Ref AWS::StackName
      Code:
        ZipFile: |
          //@inline functions/notifier.js

  # Matches every Spot warning (no tag filter); the notifier ignores the rest.
  NotifierRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-notifier"
      EventPattern:
        source: [aws.ec2]
        detail-type: [EC2 Spot Instance Interruption Warning]
      Targets:
        - Id: notifier
          Arn: !GetAtt NotifierFunction.Arn

  NotifierRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotifierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NotifierRule.Arn

  # A Fargate Spot reclaim: the task's last change, to STOPPED, so one check
  # run per task (the earlier changes carry the stop code too).
  NotifierTaskRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-notifier-tasks"
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt RunnerCluster.Arn]
          stopCode: [SpotInterruption]
          lastStatus: [STOPPED]
      Targets:
        - Id: notifier
          Arn: !GetAtt NotifierFunction.Arn

  NotifierTaskRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotifierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NotifierTaskRule.Arn

  # --- network: a VPC of its own, public subnets, no NAT --------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.77.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet0:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [10.77.0.0/16, 3, 12]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-0" }]

  Subnet0Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet0
      RouteTableId: !Ref RouteTable

  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [10.77.0.0/16, 3, 12]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-1" }]

  Subnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1
      RouteTableId: !Ref RouteTable

  Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [10.77.0.0/16, 3, 12]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-2" }]

  Subnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !Ref RouteTable

  # No inbound rules: nothing reaches a CI runner. Outbound open.
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ci-runner instances (no inbound)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  # --- launch template: one CI runner instance -------------------------------
  # No instance type (each launch passes the .xlarge overrides), no user-data
  # (each launch adds a version carrying its own #cloud-config), and no
  # instance profile, ever: the instance holds no AWS credentials.
  RunnerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-runner"
      LaunchTemplateData:
        # Resolved by EC2 at every launch: always the latest AL2023.
        ImageId: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
        InstanceInitiatedShutdownBehavior: terminate
        SecurityGroupIds: [!Ref RunnerSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 50, VolumeType: gp3, DeleteOnTermination: true, Encrypted: true }
        # IMDSv2 only, one hop: a job's containers can't reach the metadata service.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: ci-runner:stack, Value: !Ref AWS::StackName }
              - { Key: Name, Value: !Sub "${AWS::StackName}-runner" }
          - ResourceType: volume
            Tags:
              - { Key: ci-runner:stack, Value: !Ref AWS::StackName }

  # The arm64 counterpart, for the Graviton families: only the image differs.
  Arm64RunnerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-runner-arm64"
      LaunchTemplateData:
        # Resolved by EC2 at every launch: always the latest AL2023.
        ImageId: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
        InstanceInitiatedShutdownBehavior: terminate
        SecurityGroupIds: [!Ref RunnerSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 50, VolumeType: gp3, DeleteOnTermination: true, Encrypted: true }
        # IMDSv2 only, one hop: a job's containers can't reach the metadata service.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: ci-runner:stack, Value: !Ref AWS::StackName }
              - { Key: Name, Value: !Sub "${AWS::StackName}-runner" }
          - ResourceType: volume
            Tags:
              - { Key: ci-runner:stack, Value: !Ref AWS::StackName }

  # --- Fargate: the cluster and task definitions of the Fargate capacities --
  # No Docker daemon (ADR-0001) and no task role: a job finds no AWS
  # credentials, as on EC2. The launcher runs one task per job.
  RunnerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      Tags:
        - { Key: ci-runner:stack, Value: !Ref AWS::StackName }

  # The runner's output (Listening for Jobs, Running job), per task.
  RunnerTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}-runner"
      RetentionInDays: 7

  # Used by ECS to start a task, never by the job: pull the image, write the log.
  RunnerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "PowerUserPB-${AWS::StackName}-runner-exec"
      PermissionsBoundary: arn:aws:iam::aws:policy/PowerUserAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: !Sub "PowerUserPB-${AWS::StackName}-runner-exec"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The registry login supports no resource-level permissions.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !GetAtt ImageRepository.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt RunnerTaskLogGroup.Arn

  # x64 and arm64 are two task definitions: RunTask can't override the platform.
  RunnerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-runner"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # The 4-vCPU shape; each RunTask overrides cpu and memory for its size.
      Cpu: "4096"
      Memory: "16384"
      EphemeralStorage: { SizeInGiB: 50 }
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt RunnerExecutionRole.Arn
      ContainerDefinitions:
        - Name: runner
          Image: !Sub "${ImageRepository.RepositoryUri}:latest"
          Essential: true
          # The image's idle exit; the launcher's command is ./run.sh --jitconfig.
          EntryPoint: [/usr/local/bin/ci-runner-idle-exit]
          Command: [./run.sh]
          LinuxParameters: { InitProcessEnabled: true }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RunnerTaskLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: runner
      Tags:
        - { Key: ci-runner:stack, Value: !Ref AWS::StackName }

  # The arm64 counterpart: only the architecture differs.
  Arm64RunnerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-runner-arm64"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # The 4-vCPU shape; each RunTask overrides cpu and memory for its size.
      Cpu: "4096"
      Memory: "16384"
      EphemeralStorage: { SizeInGiB: 50 }
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: ARM64 }
      ExecutionRoleArn: !GetAtt RunnerExecutionRole.Arn
      ContainerDefinitions:
        - Name: runner
          Image: !Sub "${ImageRepository.RepositoryUri}:latest"
          Essential: true
          # The image's idle exit; the launcher's command is ./run.sh --jitconfig.
          EntryPoint: [/usr/local/bin/ci-runner-idle-exit]
          Command: [./run.sh]
          LinuxParameters: { InitProcessEnabled: true }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RunnerTaskLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: runner
      Tags:
        - { Key: ci-runner:stack, Value: !Ref AWS::StackName }

  # --- image: the runner image in ECR, pushed by image.yml on main ----------
  # Fargate lazy-loads only from private ECR (ADR-0002). image.yml assumes
  # the push role through GitHub OIDC: no stored key or token anywhere.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ImagePushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "PowerUserPB-${AWS::StackName}-image-push"
      PermissionsBoundary: arn:aws:iam::aws:policy/PowerUserAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Only image.yml on this repo's main (a push, the schedule or a
          # dispatch there). Any other branch, a pull request, a tag or
          # another repo has a different sub.
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            # zeroae/ci-runner uses GitHub's immutable subject, so its token's
            # sub names the owner and repo by id (owner 11018406, repo
            # 1455021495), not by name. A rename or a re-created repo with the
            # same name doesn't match. Read it with
            # `gh api repos/zeroae/ci-runner/actions/oidc/customization/sub`.
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:zeroae@11018406/ci-runner@1455021495:ref:refs/heads/main
      Policies:
        - PolicyName: !Sub "PowerUserPB-${AWS::StackName}-image-push"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The registry login supports no resource-level permissions.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # Push, and read back what it pushed, on this repo only.
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ImageRepository.Arn

  # Each build tags one image index (:latest and :<date>-<sha>), and the
  # rule keeps the last 4 of those. It counts only tagged images: the index's
  # children (each architecture's manifest and SOCI index) are untagged, and
  # an untagged rule could expire the children of an index still in use.
  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AWS::StackName
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "keep the last 4 builds",
            "selection": {"tagStatus": "tagged", "tagPatternList": ["*"], "countType": "imageCountMoreThan", "countNumber": 4},
            "action": {"type": "expire"}}]}

Outputs:
  SetupUrl:
    Description: Open in a browser to create the GitHub App (refuses everything once done).
    Value: !GetAtt SetupUrl.FunctionUrl
  WebhookUrl:
    Value: !GetAtt WebhookUrl.FunctionUrl
  AppSecretArn:
    Value: !Ref AppSecret
  LaunchTemplateId:
    Value: !Ref RunnerLaunchTemplate
  Arm64LaunchTemplateId:
    Value: !Ref Arm64RunnerLaunchTemplate
  SubnetIds:
    Value: !Join [",", [!Ref Subnet0, !Ref Subnet1, !Ref Subnet2]]
  SecurityGroupId:
    Value: !Ref RunnerSecurityGroup
  JobQueueUrl:
    Value: !Ref JobQueue
  JobDeadLetterQueueUrl:
    Value: !Ref JobDeadLetterQueue
  ImageRepositoryUri:
    Description: The repo variable ECR_IMAGE, which image.yml pushes to on main.
    Value: !GetAtt ImageRepository.RepositoryUri
  ImagePushRoleArn:
    Description: The repo variable AWS_IMAGE_PUSH_ROLE_ARN, which image.yml assumes on main.
    Value: !GetAtt ImagePushRole.Arn
  ClusterName:
    Value: !Ref RunnerCluster
  TaskDefinitionArn:
    Value: !Ref RunnerTaskDefinition
  Arm64TaskDefinitionArn:
    Value: !Ref Arm64RunnerTaskDefinition
